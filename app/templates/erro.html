<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} – Vila das Artes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div style="max-width: 440px; margin: 0 auto; padding: 56px 16px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center">
    <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo da Associação Vila das Artes" style="width: 88px; height: 88px; border-radius: 50%; background: #fff">
    <div class="sub" style="margin: 0">Erro {{ codigo }}</div>
    <h1 style="margin: 0; font-size: 24px">{{ titulo }}</h1>
    <p style="margin: 0; line-height: 1.5">{{ texto }}</p>
    <div class="linha-acoes" style="justify-content: center">
      <a class="btn" href="javascript:history.back()">Voltar</a>
      <a class="btn btn-primario" href="/">Página inicial</a>
    </div>
  </div>
</body>
</html>
